<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad-bg)" />

  <!-- Outer ambient ring glow -->
  <circle cx="256" cy="268" r="160" fill="none" stroke="url(#grad-ring)" stroke-width="20" stroke-linecap="round" stroke-dasharray="800 200" filter="url(#glow)" opacity="0.9" />

  <!-- Timer Top Knob / Button -->
  <rect x="226" y="56" width="60" height="28" rx="10" fill="#94a3b8" />
  <rect x="244" y="84" width="24" height="20" fill="#64748b" />

  <!-- Side ears -->
  <rect x="110" y="90" width="24" height="34" rx="8" transform="rotate(-35 122 107)" fill="#64748b" />
  <rect x="378" y="90" width="24" height="34" rx="8" transform="rotate(35 390 107)" fill="#64748b" />

  <!-- Inner QR Code Symbol -->
  <g transform="translate(186, 198) scale(1.4)">
    <!-- Top-left finder -->
    <rect x="0" y="0" width="36" height="36" rx="6" fill="#10b981" />
    <rect x="8" y="8" width="20" height="20" rx="3" fill="#0f172a" />
    <rect x="14" y="14" width="8" height="8" rx="1" fill="#10b981" />

    <!-- Top-right finder -->
    <rect x="64" y="0" width="36" height="36" rx="6" fill="#6366f1" />
    <rect x="72" y="8" width="20" height="20" rx="3" fill="#0f172a" />
    <rect x="78" y="14" width="8" height="8" rx="1" fill="#6366f1" />

    <!-- Bottom-left finder -->
    <rect x="0" y="64" width="36" height="36" rx="6" fill="#6366f1" />
    <rect x="8" y="72" width="20" height="20" rx="3" fill="#0f172a" />
    <rect x="14" y="78" width="8" height="8" rx="1" fill="#6366f1" />

    <!-- QR Data pattern bits -->
    <rect x="44" y="4" width="12" height="12" rx="2" fill="#38bdf8" />
    <rect x="4" y="44" width="12" height="12" rx="2" fill="#38bdf8" />
    <rect x="44" y="44" width="16" height="16" rx="4" fill="#10b981" />
    <rect x="68" y="44" width="12" height="12" rx="2" fill="#38bdf8" />
    <rect x="44" y="68" width="12" height="12" rx="2" fill="#38bdf8" />
    <rect x="68" y="68" width="28" height="12" rx="2" fill="#818cf8" />
    <rect x="84" y="84" width="12" height="12" rx="2" fill="#10b981" />
  </g>
</svg>
